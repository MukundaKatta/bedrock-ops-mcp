blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/MukundaKatta/bedrock-ops-mcp/security/policy
    about: Report security issues privately per SECURITY.md. Do not file a public issue.
  - name: MCP protocol / SDK bug
    url: https://github.com/modelcontextprotocol/typescript-sdk/issues
    about: For bugs in the underlying @modelcontextprotocol/sdk (JSON-RPC framing, stdio transport), file upstream.
  - name: Python sibling library
    url: https://github.com/MukundaKatta/bedrock-ops/issues
    about: For bugs in the actual capability data or PII-redaction logic, the canonical implementation lives in the Python bedrock-ops library.
